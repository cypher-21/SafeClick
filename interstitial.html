<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SafeClick — Redirect Confirmation</title>
  <link rel="stylesheet" href="interstitial.css" />
</head>

<body>
  <div class="sc-wrap">
    <div class="sc-card">
      <div class="sc-header">
        <img src="icons/icon48.png" alt="SafeClick" />
        <h1>Redirect Blocked</h1>
      </div>
      <p class="sc-sub">This page tried to redirect you. Choose whether to continue.</p>
      <div class="sc-target">
        <div class="sc-label">Destination</div>
        <div id="reasonWrap" class="sc-reason-wrap" aria-live="polite" style="margin:6px 0 0 0;">
          <span id="reasonBadge" class="sc-badge"
            style="display:none; padding:2px 6px; border-radius:10px; font-size:12px; background:#eef2ff; color:#334155;">reason</span>
        </div>
        <div class="sc-host-row">
          <div id="targetHost" class="sc-host">—</div>
        </div>
        <a id="targetUrl" class="sc-url" target="_blank" rel="noreferrer noopener">—</a>
      </div>
      <div class="sc-controls" role="group" aria-label="Redirect options">

        <label class="sc-inline">
          <span class="sc-ico" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="9" y1="3" x2="9" y2="21"></line>
            </svg>
          </span>
          <input type="checkbox" id="openNewTabChk" />
          Open in New Tab
        </label>
        <div class="sc-inline" style="display:flex; gap:8px; align-items:center;">
          <span class="sc-ico" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
          </span>
          <label for="durationSelect" class="sr-only">Temporary Allow</label>
          <select id="durationSelect" aria-label="Temporary Allow">
            <option value="off">Off</option>
            <option value="30000">30 seconds</option>
            <option value="60000">1 minute</option>
            <option value="300000">5 minutes</option>
            <option value="custom">Custom…</option>
          </select>
          <input id="durationCustom" type="number" min="5" step="5" placeholder="Seconds" aria-label="Custom seconds"
            style="width:110px; display:none;" />
        </div>
        <button id="copyUrlBtn" class="sc-btn sc-btn-ghost" type="button" aria-label="Copy destination URL">
          <span class="sc-ico" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </span> Copy URL
        </button>
      </div>
      <div class="sc-countdown" id="countdownWrap">
        <span>Auto-block in </span><span id="countdown">—</span>
        <button id="pauseTimerBtn" class="sc-btn sc-btn-ghost" type="button">Pause</button>
      </div>
      <div id="status" class="sc-status"></div>
      <div class="sc-actions">
        <button id="blockBtn" class="sc-btn sc-btn-danger">Block</button>
        <button id="allowBtn" class="sc-btn sc-btn-primary sc-pulse">Allow and Continue</button>
      </div>
      <div class="sc-note" id="note"></div>
    </div>
  </div>
  <script src="config.js"></script>
  <script src="interstitial.js"></script>
</body>

</html>
